name: finalize-dxbot-plan

on:
  push:
    branches: [main]
    paths:
      - 'docs/plan/20260821-0927-v0-1-detailed-development-plan/**'
      - '.github/workflows/finalize-dxbot-plan.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and verify all-in-one
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('docs/plan/20260821-0927-v0-1-detailed-development-plan')
          groups = [
              '00-governance', '10-architecture', '20-domains', '30-runtime',
              '40-interfaces', '50-engineering', '60-delivery'
          ]
          files = ['readme.md'] + [
              str(p.relative_to(root))
              for group in groups
              for p in sorted((root / group).glob('*.md'))
          ]

          def strip_frontmatter(text: str) -> str:
              if text.startswith('---\n'):
                  idx = text.find('\n---\n', 4)
                  if idx >= 0:
                      return text[idx + 5:].lstrip('\n')
              return text

          def first_h1(text: str) -> str:
              return next(
                  line[2:]
                  for line in strip_frontmatter(text).splitlines()
                  if line.startswith('# ')
              )

          header = '''---
          title: "DXBOT 상세 개발 기획 통합본"
          document_id: "DXB-ALL"
          version: "0.1.0"
          status: "Generated Compilation"
          normative: false
          priority: "N/A"
          last_updated: "2026-08-21"
          depends_on: ["DXB-SOURCE-000", "DXB-BASE-000"]
          ---

          # DXBOT 상세 개발 기획 — 통합본

          > 원본은 주제별 Markdown 파일로 분리되어 있으며, 이 파일은 검색·검토 편의를 위한 병합본이다.

          ## 문서 목차

          '''
          header = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in header.splitlines()
          )

          toc = '\n'.join(
              f'{i}. `{path}` — {first_h1((root / path).read_text(encoding="utf-8"))}'
              for i, path in enumerate(files, 1)
          )

          parts = ''.join(
              f'\n\n---\n\n\n\n# Part {i}: `{path}`\n\n'
              + strip_frontmatter((root / path).read_text(encoding='utf-8')).rstrip()
              + '\n'
              for i, path in enumerate(files, 1)
          )

          content = header + toc + parts + '\n\n---\n'
          data = content.encode('utf-8')
          digest = hashlib.sha256(data).hexdigest()
          expected = 'd55ff651e9b5dedb72754935753190b154c726f832d830bbf31aa465273a4d74'
          if len(data) != 275535 or digest != expected:
              raise SystemExit(f'aggregate mismatch: bytes={len(data)} sha256={digest}')
          (root / 'all-in-one.md').write_bytes(data)
          print(f'all-in-one.md: {len(data)} bytes sha256={digest}')
          PY

      - name: Commit aggregate and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/plan/20260821-0927-v0-1-detailed-development-plan/all-in-one.md
          git rm .github/workflows/finalize-dxbot-plan.yml
          git commit -m 'docs: finalize DXBOT plan aggregate'
          git push
