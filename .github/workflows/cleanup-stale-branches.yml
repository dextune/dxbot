name: Cleanup stale branches

on:
  push:
    paths:
      - '.github/workflows/cleanup-stale-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale remote branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          branches = [
              "adversarial-review-converged",
              "adversarial-review-final",
              "adversarial-review-finalize",
              "adversarial-review-validation",
              "automation/v0-8-five-pass-import",
              "ci/m1a-validation-b0185d4",
              "develop/m1a-storage-proof",
              "docs/agents-md-review",
              "docs/grok-adoption-plan-staging",
              "docs/v0-2-plan-review",
          ]

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPO"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          failures = []
          for branch in branches:
              ref = urllib.parse.quote(f"heads/{branch}", safe="/")
              url = f"https://api.github.com/repos/{repo}/git/refs/{ref}"
              request = urllib.request.Request(url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(request) as response:
                      if response.status != 204:
                          failures.append(f"{branch}: unexpected HTTP {response.status}")
                      else:
                          print(f"deleted: {branch}")
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print(f"already absent: {branch}")
                  else:
                      failures.append(f"{branch}: HTTP {error.code} {error.reason}")

          if failures:
              raise SystemExit("\n".join(failures))
          PY
