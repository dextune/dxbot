[package]
name = "runtime-host"
version = "0.1.0"
description = "DXBOT runtime host: lifecycle, deterministic composition, and generation fencing."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Forward the production adapter selection to `provider-host`. `default`
# enables every production adapter; a removal build turns individual adapters
# off with `--no-default-features --features <slice>` and the Runtime config
# owner then gates the matching config-decoding path (`DXB-DEL-068` H11).
default = ["direct-deepseek", "direct-minimax", "dsh-acp"]
direct-deepseek = ["provider-host/direct-deepseek"]
direct-minimax = ["provider-host/direct-minimax"]
dsh-acp = ["provider-host/dsh-acp"]

[dependencies]
application = { path = "../application" }
control-server = { path = "../control-server" }
dxbot-core = { path = "../dxbot-core" }
provider-host = { path = "../provider-host", default-features = false }
runtime-bootstrap = { path = "../runtime-bootstrap" }
runtime-audit = { path = "../runtime-audit" }
runtime-security = { path = "../runtime-security" }
fs2 = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
