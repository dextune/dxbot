[package]
name = "cli"
version = "0.1.0"
description = "DXBOT CLI: local journal, single-writer takeover, hash chain, bounded retention."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dxb"
path = "src/main.rs"

[[bin]]
name = "journal-helper"
path = "src/bin/journal_helper.rs"

[lints]
workspace = true

[dependencies]
application-contract = { path = "../application-contract" }
control-client = { path = "../control-client" }
dxbot-core = { path = "../dxbot-core" }
runtime-bootstrap = { path = "../runtime-bootstrap" }
runtime-host = { path = "../runtime-host" }
fs2 = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
