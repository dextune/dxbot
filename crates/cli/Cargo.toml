[package]
name = "cli"
version = "0.1.0"
description = "DXBOT CLI: local journal, single-writer takeover, hash chain, bounded retention."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dxb"
path = "src/main.rs"

[[bin]]
name = "journal-helper"
path = "src/bin/journal_helper.rs"

[lints]
workspace = true

[features]
# Forward the production adapter selection through to `runtime-host` so the
# built `dxb` CLI can be produced for each adapter-removal variant
# (`DXB-DEL-068` H11): normal (all production, no testkit), DSH-only
# (`--no-default-features --features dsh-acp`), direct-MiniMax-only, etc. The
# testkit is never enabled here, so a normal CLI build carries no canary.
default = ["direct-deepseek", "direct-minimax", "dsh-acp"]
direct-deepseek = ["runtime-host/direct-deepseek"]
direct-minimax = ["runtime-host/direct-minimax"]
dsh-acp = ["runtime-host/dsh-acp"]

[dependencies]
application-contract = { path = "../application-contract" }
control-client = { path = "../control-client" }
dxbot-core = { path = "../dxbot-core" }
runtime-bootstrap = { path = "../runtime-bootstrap" }
runtime-host = { path = "../runtime-host", default-features = false }
fs2 = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
