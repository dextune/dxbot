[package]
name = "control-server"
version = "0.1.0"
description = "DXBOT control endpoint server: security boundary, fail-closed path."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
application-contract = { path = "../application-contract" }
dxbot-core = { path = "../dxbot-core" }
runtime-security = { path = "../runtime-security" }
application = { path = "../application" }
provider-host = { path = "../provider-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["socket"] }
