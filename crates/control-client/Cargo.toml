[package]
name = "control-client"
version = "0.1.0"
description = "DXBOT control endpoint client: submission protocol, durable Prepared/Dispatching, binding lookup recovery."
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
dxbot-core = { path = "../dxbot-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "submission-crash-probe"
path = "src/bin/submission_crash_probe.rs"