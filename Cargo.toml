[workspace]
members = ["crates/storage-spike"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/dextune/dxbot"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
