# DXBOT-owned audited DeepSeek Harness (DSH) ACP profile patch.
#
# DXB-DEL-068 H6/H7 — this file is the composition the pinned DSH executable
# loads with `--profile acp --patch <this file>`. It is intentionally minimal
# and audited:
#
#   * It uses the official `@deepseek-ai/dsh-llm-pi-ai` hand-declared route
#     (NOT the direct `@deepseek-ai/dsh-llm-deepseek` adapter) to reach MiniMax.
#   * The MiniMax route is pinned to provider `minimax` / model `MiniMax-M3`
#     over the `anthropic-messages` wire protocol at the MiniMax endpoint.
#   * The credential is a reference only: `apiKeyEnv: MINIMAX_API_KEY`. The raw
#     key never appears in this file, in argv, in the DSH state, or in logs.
#     DXBOT materializes exactly `MINIMAX_API_KEY` into the child's scrubbed
#     environment; nothing else ambient is forwarded.
#   * The direct DeepSeek route (`@deepseek-ai/dsh-llm-deepseek`) is disabled so
#     there is no alternate provider and no silent model/provider fallback.
#   * `session/set_config_option` and `session/new` config-option state must
#     advertise the exact model `currentValue` `["minimax","MiniMax-M3"]`; the
#     DXBOT provider verifies this exact route before publishing any activity
#     and fails closed on any drift.
#
# Isolation:
#   * DSH_HOME is a dedicated, per-deployment isolated directory (see the
#     runbook). Ambient user DSH home, SSH/cloud/package-manager credentials,
#     and shell profiles are never shared with the child.
#   * The ACP server keeps stdout for protocol frames only; DXBOT captures a
#     bounded, redacted view of stderr and never mixes it into the protocol.
#
# Pin: this patch targets the official DeepSeek Harness snapshot recorded in
# DXB-DEL-064 — commit cd5ef8148158c3a752a658978873241fdf8e2bbc, tag
# dsh-v0.1.2-alpha.1, root package version 0.1.2-alpha.1, MIT, developer
# preview. Upgrades require a separate compatibility/conformance/SBOM review.

# Disable the direct DeepSeek adapter: no alternate provider and no silent
# fallback to a non-MiniMax model.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

# Activate exactly one pi-ai route. `apiKeyEnv` is a credential reference; no
# secret is stored in this patch.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      minimax:
        apiKeyEnv: MINIMAX_API_KEY
        api: anthropic-messages
        baseURL: https://api.minimax.io/anthropic
        models:
          - id: MiniMax-M3

# Pin the transport-independent model default as defense in depth. The ACP row
# below is still the source used when the ACP server creates each session.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: minimax
    model: MiniMax-M3

# Replace the ACP row's complete config while preserving its required startup
# injection. The provider verifies the resulting session model option before it
# sends a prompt.
- id: acp
  name: '@deepseek-ai/dsh-acp'
  inject: [acpAppStartup]
  config:
    provider: minimax
    model: MiniMax-M3
